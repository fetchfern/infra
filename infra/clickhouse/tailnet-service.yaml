apiVersion: v1
kind: Service
metadata:
  name: clickhouse-tailnet
  annotations:
    tailscale.com/hostname: modrinth-clickhouse
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: clickhouse-cluster-clickhouse
  ports:
    - name: clickhouse
      port: 9000
      targetPort: 9000
