apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: modrinth-clickhouse-keeper
spec:
  replicas: 3
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: modrinth-clickhouse-cluster
spec:
  replicas: 2
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  keeperClusterRef:
    name: modrinth-clickhouse-keeper