apiVersion: apps/v1
kind: Deployment
metadata:
  name: archon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archon
  template:
    metadata:
      labels:
        app: archon
    spec:
      containers:
        - name: archon
          image: archon
          imagePullPolicy: IfNotPresent
          args: ["/archon/archon", "--core"]
          envFrom:
            - configMapRef:
                name: archon-config
            - secretRef:
                name: archon-db-app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: archon-db-app
                  key: uri
            - name: DATABASE_MIN_CONNECTIONS
              value: "4"
            - name: DATABASE_MAX_CONNECTIONS
              value: "16"
            - name: REDIS_URL
              value: redis://rfr-archon-redis.modrinth-infra.svc.cluster.local:6379
            - name: REDIS_MAX_CONNECTIONS
              value: "128"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            initialDelaySeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            initialDelaySeconds: 3
            failureThreshold: 9
